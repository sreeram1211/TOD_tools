plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kapow.tod'
    compileSdk 34

    defaultConfig {
        applicationId "com.kapow.tod"
        minSdk 24       // Android 7.0+ (OpenGL ES 3.0 guaranteed)
        targetSdk 34
        versionCode 1
        versionName "34.7.1925"

        ndk {
            // Target 64-bit ARM and x86_64 (emulator)
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++14 -fno-exceptions -fno-rtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        debug {
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Game data goes in assets
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
